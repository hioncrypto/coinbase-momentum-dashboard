# fly.toml — BeatLine on Fly.io
# From kalshi-btc-target/:
#   fly auth login
#   fly apps create beatline-YOURNAME
#   fly volumes create beatline_data --size 1 --region iad
#   fly deploy

app = "beatline"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "beatline_data"
  destination = "/app/data"
