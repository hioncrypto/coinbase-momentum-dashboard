<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Kalshi 15-minute BTC Price to beat with 1m/5m/15m charts, live price, and countdown."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <title>Kalshi BTC Target</title>
    <link rel="stylesheet" href="/styles.css" />
    <script
      src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"
      defer
    ></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Kalshi BTC Target</h1>
          <p class="sub">Kalshi 15m Price to beat · chart · Yes/No %</p>
        </div>
      </div>
      <div class="top-right">
        <button
          type="button"
          id="push-badge"
          class="push-badge"
          title="Alerts off"
          aria-label="Toggle alerts"
          aria-pressed="false"
        >
          <svg class="bell-outline" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
              d="M12 3.2a6.2 6.2 0 0 0-6.2 6.2v3.4L4 15.4V17h16v-1.6l-1.8-2.6V9.4A6.2 6.2 0 0 0 12 3.2Z"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              d="M9.6 17a2.4 2.4 0 0 0 4.8 0"
            />
          </svg>
          <svg class="bell-filled" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 22a2.2 2.2 0 0 0 2.2-2.2h-4.4A2.2 2.2 0 0 0 12 22Zm7-6.2V11a7 7 0 1 0-14 0v4.8L3 17.8V19h18v-1.2l-2-1.8Z"
            />
          </svg>
          <span class="push-badge-dot" aria-hidden="true"></span>
        </button>
        <div id="status" class="status" data-state="loading">Connecting…</div>
      </div>
    </header>

    <section class="target-panel" aria-live="polite">
      <div class="tf-row">
        <span class="tf-label" id="tf-label">Chart</span>
        <div
          id="timeframe"
          class="tf-btns"
          role="group"
          aria-labelledby="tf-label"
        >
          <button type="button" class="tf-btn" data-tf="15m" aria-pressed="true">15m</button>
          <button type="button" class="tf-btn" data-tf="5m" aria-pressed="false">5m</button>
          <button type="button" class="tf-btn" data-tf="1m" aria-pressed="false">1m</button>
        </div>
      </div>

      <div class="sound-row">
        <label class="sound-toggle" id="chime-toggle-label" title="Long-press to test chime">
          <input type="checkbox" id="chime-enabled" checked />
          Chime on new 15m target
        </label>
      </div>
      <p id="bg-status" class="sound-hint" hidden></p>

      <div class="metrics">
        <div class="metric">
          <div id="target-label" class="label">Price to beat</div>
          <div id="target-value" class="value beat">—</div>
          <div id="target-meta" class="meta">Waiting for Kalshi 15m…</div>
        </div>
        <div class="metric">
          <div class="label">Moving price · Kalshi BRTI</div>
          <div id="spot-value" class="value spot">—</div>
          <div class="meta">
            <span id="spot-delta" class="spot-delta"></span>
          </div>
        </div>
      </div>

      <div class="odds-row" id="odds-row" hidden>
        <div class="odd yes">
          <span class="odd-label">Yes</span>
          <span id="yes-pct" class="odd-pct">—</span>
        </div>
        <div class="odd no">
          <span class="odd-label">No</span>
          <span id="no-pct" class="odd-pct">—</span>
        </div>
      </div>

      <div class="countdown-block">
        <div class="label">Time left</div>
        <div id="countdown" class="countdown">—:—</div>
        <div id="countdown-meta" class="meta">Until Kalshi 15m window ends</div>
      </div>
    </section>

    <main id="chart" role="img" aria-label="BTC-USD chart with Kalshi target line"></main>

    <footer class="foot">
      <span id="chart-tf-label">Chart · 15m candles</span>
      <span id="clock"></span>
    </footer>
  </body>
</html>
