<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kalshi Price to beat — Android</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1210;
        --fg: #e7f6ee;
        --muted: #8fa399;
        --accent: #1ac96b;
      }
      body {
        margin: 0;
        font: 16px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 420px at 0% 0%, #163528, transparent 60%),
          var(--bg);
        color: var(--fg);
        padding: 20px 18px 40px;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { color: var(--muted); }
      ol { padding-left: 1.2rem; }
      li { margin: 12px 0; }
      a.btn {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        background: #163526;
        color: var(--fg);
        text-decoration: none;
        border: 1px solid rgba(26, 201, 107, 0.45);
        font-weight: 600;
      }
      .card {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 12px;
        background: rgba(12, 20, 16, .7);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Android · Kalshi Price to beat</h1>
      <p>
        Auto TARGET line from Kalshi’s 15-minute <strong>Price to beat</strong>.
        No Tampermonkey required.
      </p>
      <div class="card">
        <ol>
          <li>Open the chart app in Chrome</li>
          <li>Chrome menu → <strong>Add to Home Screen</strong></li>
          <li>Open the icon — line updates every 15 minutes automatically</li>
        </ol>
        <a class="btn" href="/">Open chart app</a>
      </div>
    </main>
  </body>
</html>
