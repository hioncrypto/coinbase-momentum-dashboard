  <path d="M40 28 H62 C78 28 86 36 86 46 C86 54 80 58 70 60 H40 Z" fill="#1ac96b"/>
  <path d="M40 60 H72 C86 60 94 68 94 78 C94 92 82 100 64 100 H40 Z" fill="#c84848"/>
