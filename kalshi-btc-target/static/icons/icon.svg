<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BeatLine">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1a2f26"/>
      <stop offset="100%" stop-color="#070c0a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Beat line -->
  <rect x="22" y="60" width="84" height="8" rx="4" fill="#e8f5ee"/>
