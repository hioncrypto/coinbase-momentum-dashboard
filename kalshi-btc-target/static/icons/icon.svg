<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BeatLine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12201a"/>
      <stop offset="100%" stop-color="#0b1210"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="#121f19"/>
  <!-- Beat / TARGET line -->
  <line x1="18" y1="66" x2="110" y2="66" stroke="#e7f6ee" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.92"/>
  <line x1="18" y1="60" x2="18" y2="72" stroke="#1ac96b" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="60" x2="110" y2="72" stroke="#1ac96b" stroke-width="3" stroke-linecap="round"/>
  <!-- Below candle -->
  <line x1="36" y1="62" x2="36" y2="98" stroke="#d45454" stroke-width="3" stroke-linecap="round"/>
  <rect x="28" y="68" width="16" height="24" rx="2" fill="#d45454"/>
  <!-- Above candles -->
  <line x1="62" y1="28" x2="62" y2="70" stroke="#1ac96b" stroke-width="3" stroke-linecap="round"/>
  <rect x="54" y="34" width="16" height="30" rx="2" fill="#1ac96b"/>
  <line x1="88" y1="32" x2="88" y2="68" stroke="#1ac96b" stroke-width="3" stroke-linecap="round"/>
  <rect x="80" y="38" width="16" height="26" rx="2" fill="#1ac96b"/>
  <!-- Above/Below badge -->
  <circle cx="100" cy="100" r="16" fill="#163526" stroke="#1ac96b" stroke-width="2.5"/>
  <path d="M100 90 L94 97 L106 97 Z" fill="#1ac96b"/>
  <path d="M100 110 L94 103 L106 103 Z" fill="#d45454"/>
</svg>
